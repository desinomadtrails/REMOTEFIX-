name: Deploy RemoteFix Admin to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Admin Console
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Check Azure Admin Secret Availability
        id: secret_check
        run: |
          if [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN secret is unconfigured. Skipping live Static Web App deployment."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/admin/dist"
          output_location: ""
          skip_app_build: true
