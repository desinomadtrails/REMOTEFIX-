name: RemoteFix Monorepo Continuous Integration

on:
  push:
    branches: [ develop, main, "release/*" ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Monorepo Quality Gate & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Workspace Type Check
        run: npm run typecheck

      - name: Execute Automated Integration & Microservice Tests
        run: npm run test

      - name: Monorepo Production Build
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Container Build
        run: docker build -t remotefix-api:test -f Dockerfile .
