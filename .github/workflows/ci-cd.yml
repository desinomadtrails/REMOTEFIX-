name: RemoteFix Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Monorepo Workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Typecheck Across Workspaces
        run: npm run typecheck

      - name: Execute Automated Integration & Microservice Tests
        run: npm run test

      - name: Build Monorepo Workspaces
        run: npm run build

  docker-build:
    name: Build & Containerize Production Images
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production API & Frontend Container Images
        run: |
          docker build -t remotefix-api:latest -f Dockerfile .
