name: Deploy RemoteFix API to Azure App Service

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy API Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p deploy_dist
          cp -r apps/api deploy_dist/
          cp -r packages deploy_dist/
          cp package.json package-lock.json deploy_dist/
          cd deploy_dist && zip -r ../api-deployment.zip .

      - name: Check Azure WebApp Secret Availability
        id: secret_check
        run: |
          if [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "::notice::AZURE_WEBAPP_PUBLISH_PROFILE secret is unconfigured. Skipping live deployment."
          fi

      - name: Deploy to Azure Web App
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'remotefix-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'api-deployment.zip'
