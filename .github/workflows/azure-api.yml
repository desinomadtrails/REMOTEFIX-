name: Deploy RemoteFix API to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Workspace Packages
        run: npm run build

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy_dist
          cp -r apps/api deploy_dist/
          cp -r packages deploy_dist/
          cp package.json package-lock.json deploy_dist/
          cd deploy_dist && zip -r ../api-deployment.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'remotefix-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'api-deployment.zip'
